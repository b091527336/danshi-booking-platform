name: DBP OmniDesk scheduled publishing
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  id-token: write
concurrency:
  group: dbp-omni-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish due OmniDesk posts
        shell: python
        run: |
          import json, os, urllib.parse, urllib.request
          endpoint = 'https://dbp.danshi.com.tw/api/internal/omni-cron'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          client = urllib.request.build_opener(NoRedirect())
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(endpoint, safe='')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with client.open(request, timeout=30) as response:
              token = json.load(response)['value']
          request = urllib.request.Request(endpoint, data=b'', method='POST', headers={'X-DBP-Cron-Identity': 'Bearer ' + token, 'Origin': 'https://dbp.danshi.com.tw', 'User-Agent': 'Danshi-DBP-Scheduler/1.0'})
          with client.open(request, timeout=180) as response:
              result = json.load(response)
          if result.get('ok') is not True:
              raise RuntimeError('DBP scheduled posting scan did not complete')
          print(json.dumps(result, ensure_ascii=False))
